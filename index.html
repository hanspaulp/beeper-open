<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Open the chat</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 48px 16px; background: #fff; color: #111; }
  main { max-width: 32rem; margin: 0 auto; }
  a { color: #1a5fd0; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } a { color: #8ab4ff; } }
</style>
</head>
<body>
<main>
<p id="msg">Opening the chat…</p>
<p id="alt" hidden>Nothing happened? <a id="go" href="#">Open it in <span id="app"></span></a>.<span id="need"></span></p>
</main>
<script>
// The GTM cockpit's chat buttons land here, because a Garden widget opens only https links on another
// site. The chat travels after the #, so it never reaches a server.
// WhatsApp opens in Beeper Desktop: only a chat id of the two shapes Beeper uses is accepted (the same rule
// as beeperUrl in the cockpit's server.js); a chat on the +1 number's local bridge needs its account.
// iMessage opens in Messages: only a phone number (+ and 6 to 15 digits) or an email address is accepted
// (the same rule as IMESSAGE_TO in the brain's gtm-cockpit-bodies.py), sent as sms:<address>.
(function () {
  var q = new URLSearchParams(location.hash.slice(1));
  var channel = q.get('channel'), url = null, app = null;
  if (channel === 'whatsapp') {
    var chat = q.get('chat') || '';
    var m = /^![A-Za-z0-9_-]{1,80}:(?:beeper\.local|([A-Za-z0-9_-]{1,80})\.local-whatsapp\.localhost)$/.exec(chat);
    if (m) { url = 'beeper://select-thread/bridge-whatsapp/' + chat + (m[1] ? '?accountID=local-whatsapp_' + m[1] : ''); app = 'Beeper'; }
  } else if (channel === 'imessage') {
    var to = q.get('to') || '';
    if (/^\+[0-9]{6,15}$/.test(to) || /^[A-Za-z0-9._%+-]{1,64}@[A-Za-z0-9.-]{1,190}\.[A-Za-z]{2,24}$/.test(to)) { url = 'sms:' + to; app = 'Messages'; }
  }
  if (!url) { document.getElementById('msg').textContent = 'This is not a chat link.'; return; }
  document.getElementById('msg').textContent = 'Opening the chat in ' + app + '…';
  document.getElementById('app').textContent = app;
  document.getElementById('need').textContent = app === 'Beeper' ? ' Beeper Desktop has to be installed on this computer.' : '';
  document.getElementById('go').href = url;
  document.getElementById('alt').hidden = false;
  location.href = url;
})();
</script>
</body>
</html>
